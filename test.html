<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WOMAN・KIDS・MENの商品一覧ページ">
  <title>商品一覧</title>
  <style>
    :root {
      --ink: #181818;
      --muted: #777;
      --line: #dedbd5;
      --paper: #fbfaf7;
      --accent: #8a5e48;
      --content-width: 1180px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background: #fff;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    img { display: block; width: 100%; }
    a { color: inherit; text-decoration: none; }

    .page-header {
      padding: 24px clamp(20px, 5vw, 72px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      letter-spacing: .16em;
    }

    .nav { display: flex; gap: 24px; font-size: 12px; letter-spacing: .12em; }
    .nav a:hover { color: var(--accent); }

    .hero {
      min-height: 280px;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      text-align: center;
      background:
        linear-gradient(100deg, rgba(31,24,20,.42), rgba(31,24,20,.08)),
        url("images/banpaku_mainbanner.jpg") center / cover no-repeat,
        #c9c0b8;
      color: white;
    }

    .hero__copy { text-shadow: 0 2px 16px rgba(0,0,0,.28); }
    .hero__eyebrow { margin: 0 0 10px; font-size: 12px; letter-spacing: .3em; }
    .hero__title { margin: 0; font: 400 clamp(32px, 6vw, 58px)/1.1 Georgia, serif; letter-spacing: .08em; }

    main { width: min(var(--content-width), calc(100% - 40px)); margin: 0 auto; }

    .page-title { padding: 72px 0 44px; text-align: center; }
    .page-title h1 { margin: 0 0 12px; font-size: clamp(26px, 4vw, 38px); font-weight: 500; letter-spacing: .16em; }
    .page-title p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .22em; }

    .category { padding: 22px 0 92px; }
    .category__title {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 0 0 30px;
      font: 400 19px/1 Georgia, serif;
      letter-spacing: .24em;
    }

    .category__title::after { content: ""; height: 1px; flex: 1; background: var(--line); }

    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(18px, 3vw, 38px); }

    .product-card { display: block; }
    .product-card__image { position: relative; overflow: hidden; aspect-ratio: 1 / 1; background: var(--paper); }
    .product-card__image img { height: 100%; object-fit: contain; transition: transform .5s ease; }
    .product-card:hover .product-card__image img { transform: scale(1.035); }
    .product-card__image::after {
      content: "VIEW ITEM";
      position: absolute;
      inset: auto 14px 14px auto;
      padding: 8px 11px;
      background: rgba(255,255,255,.9);
      font-size: 10px;
      letter-spacing: .14em;
      opacity: 0;
      transform: translateY(5px);
      transition: .25s ease;
    }
    .product-card:hover .product-card__image::after { opacity: 1; transform: none; }

    .product-card__body { padding: 15px 2px 0; }
    .product-card__name { margin: 0 0 7px; font-size: 14px; font-weight: 500; }
    .product-card__price { margin: 0; color: var(--muted); font-size: 13px; }

    .product-card[hidden] { display: none; }

    .category__actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 32px;
    }

    .more-button {
      min-width: 118px;
      padding: 11px 22px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 12px;
      letter-spacing: .12em;
      cursor: pointer;
      transition: color .2s ease, background-color .2s ease;
    }

    .more-button:hover,
    .more-button:focus-visible {
      color: #fff;
      background: var(--ink);
    }

    .more-button[hidden] { display: none; }

    .page-footer { padding: 42px 20px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .12em; }

    @media (max-width: 720px) {
      .page-header { padding-block: 18px; }
      .nav { gap: 12px; }
      .hero {
        min-height: 0;
        aspect-ratio: 5 / 3;
        background-image: url("images/banpaku_mainbanner_sp.jpg");
        background-position: center;
        background-size: cover;
      }
      .page-title { padding: 52px 0 34px; }
      .category { padding-bottom: 66px; }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 14px; }
      .category__actions { margin-top: 26px; }
    }

    @media (max-width: 440px) {
      .page-header {
        padding: 16px 18px;
        gap: 10px;
      }
      .logo {
        font-size: 18px;
        letter-spacing: .1em;
        white-space: nowrap;
      }
      .nav {
        gap: 8px;
        flex-shrink: 0;
        font-size: 9px;
        letter-spacing: .05em;
      }
      .nav a { display: block; }
      .product-grid { grid-template-columns: 1fr; gap: 36px; }
    }
  </style>
</head>
<body>

    <nav class="nav" aria-label="カテゴリーナビゲーション">

  <footer class="page-footer">© 2026 YOUR BRAND</footer>

  <script>
    (() => {
      const mobileQuery = window.matchMedia('(max-width: 720px)');
      const categories = document.querySelectorAll('.category');

      const getInitialLimit = () => mobileQuery.matches ? 6 : 9;

      const updateCategory = (category) => {
        const cards = [...category.querySelectorAll('.product-card')];
        const button = category.querySelector('.more-button');
        const expanded = button.getAttribute('aria-expanded') === 'true';
        const limit = getInitialLimit();

        cards.forEach((card, index) => {
          card.hidden = !expanded && index >= limit;
        });

        button.hidden = cards.length <= limit;
        button.textContent = expanded ? '閉じる' : 'もっとみる';
      };

      categories.forEach((category) => {
        const button = category.querySelector('.more-button');

        button.addEventListener('click', () => {
          const expanded = button.getAttribute('aria-expanded') === 'true';
          button.setAttribute('aria-expanded', String(!expanded));
          updateCategory(category);

          if (expanded) {
            category.querySelector('.category__title').scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });
          }
        });

        updateCategory(category);
      });

      mobileQuery.addEventListener('change', () => {
        categories.forEach(updateCategory);
      });
    })();
  </script>
</body>
