<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="noeliaの商品詳細ページ">
  <title>ear ショルダーバッグ｜noelia</title>
  <style>
    :root {
      --ink: #181818;
      --muted: #777;
      --line: #dedbd5;
      --paper: #fbfaf7;
      --accent: #8a5e48;
      --content-width: 760px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: #fff;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    img {
      display: block;
      width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-header {
      padding: 24px clamp(20px, 5vw, 72px);
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .logo {
      display: inline-block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      letter-spacing: .16em;
    }

    .product-page {
      width: min(var(--content-width), calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0 88px;
      text-align: center;
    }

    .main-image {
      width: min(100%, 620px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .main-image img {
      height: 100%;
      object-fit: contain;
    }

    .product-price {
      margin: 30px 0 0;
      font-size: 18px;
      letter-spacing: .06em;
    }

    .product-description {
      width: min(100%, 620px);
      margin: 30px auto 0;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
      line-height: 2;
    }

    .product-description p {
      margin: 0 0 1em;
    }

    .detail-gallery {
      width: min(100%, 760px);
      margin: 54px auto 0;
      display: grid;
      gap: 24px;
    }

    .detail-image {
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--paper);
    }

    .detail-image img {
      height: 100%;
      object-fit: cover;
    }

    .top-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      min-height: 52px;
      margin-top: 64px;
      border: 1px solid var(--ink);
      font-size: 13px;
      letter-spacing: .16em;
      transition: color .25s ease, background-color .25s ease;
    }

    .top-button:hover {
      color: #fff;
      background: var(--ink);
    }

    .page-footer {
      padding: 42px 20px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
    }

    @media (max-width: 720px) {
      .page-header { padding-block: 18px; }

      .product-page {
        width: min(100% - 32px, var(--content-width));
        padding: 36px 0 64px;
      }

      .product-price {
        margin-top: 24px;
        font-size: 16px;
      }

      .product-description {
        margin-top: 24px;
        padding-top: 22px;
        font-size: 13px;
        line-height: 1.9;
      }

      .detail-gallery {
        margin-top: 38px;
        gap: 16px;
      }

      .top-button {
        width: 100%;
        margin-top: 48px;
      }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <a class="logo" href="index.html" aria-label="noeliaトップページ">noelia</a>
  </header>

  <main class="product-page">
    <!-- 正方形の商品画像：images/item-c-main.png を差し替えてください -->
    <div class="main-image">
      <img src="images/item-c-main.png" alt=" GALLARDAGALANTE セットアップ">
    </div>

    <p class="product-price">¥5,000（税込）</p>

    <section class="product-description" aria-label="商品詳細">
      <p>
      GALLARDAGALANTE セットアップ<br>
ニットセットアップ
        
      </p>
     <!-- <p>
        複数の段落に分けたい場合は、このように&lt;p&gt;タグを追加します。
      </p>-->
    </section>

    <div class="detail-gallery" aria-label="商品詳細画像">
      <!--
        横長画像を増やす場合は、下の3行をコピーしてファイル名だけ変更してください。

        <div class="detail-image">
          <img src="images/item-a2.jpg" alt="商品の詳細画像2" loading="lazy">
        </div>
      -->
      <div class="detail-image">
        <img src="images/item-a2.jpg" alt="商品の詳細画像1" loading="lazy">
      </div>
    </div>

    <a class="top-button" href="index.html">TOPへ</a>
  </main>

  <footer class="page-footer">© 2026 noelia</footer>
</body>
</html>
